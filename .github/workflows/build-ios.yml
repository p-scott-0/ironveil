name: Build iOS IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  APP_NAME: Ironveil
  BUNDLE_ID: com.pscott.ironveil
  VERSION_SHORT: "0.1"

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Install Godot ─────────────────────────────────────────────────────
      - name: Download & install Godot 4.6.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_macos.universal.zip
          unzip -q Godot_v4.6.3-stable_macos.universal.zip
          sudo mv Godot.app /Applications/Godot.app

      # ── 3. Install export templates ──────────────────────────────────────────
      - name: Download & install export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.6.3.stable"
          mkdir -p "$TEMPLATE_DIR"
          unzip -q Godot_v4.6.3-stable_export_templates.tpz -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* "$TEMPLATE_DIR/"

      # ── 4. Export game data pack (bypasses signing validation) ────────────────
      - name: Export game data (.pck)
        run: |
          mkdir -p build/pck
          /Applications/Godot.app/Contents/MacOS/Godot \
            --headless \
            --export-pack "iOS" \
            "$GITHUB_WORKSPACE/build/pck/$APP_NAME.pck" \
            --path "$GITHUB_WORKSPACE"
          echo "PCK exported: $(du -sh build/pck/$APP_NAME.pck)"

      # ── 5. Extract & process iOS template manually ────────────────────────────
      - name: Set up Xcode project from template
        run: |
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.6.3.stable"
          PROJ_DIR="$GITHUB_WORKSPACE/build/ios"
          mkdir -p "$PROJ_DIR"

          # Extract the iOS template
          unzip -q "$TEMPLATE_DIR/ios.zip" -d "$PROJ_DIR"

          echo "=== Template top-level ==="
          ls "$PROJ_DIR"

          # Find the xcodeproj
          XCPROJ=$(find "$PROJ_DIR" -maxdepth 2 -name "*.xcodeproj" | head -1)
          echo "Found xcodeproj: $XCPROJ"

          # Rename xcodeproj to our app name
          XCPROJ_DIR=$(dirname "$XCPROJ")
          NEW_XCPROJ="$XCPROJ_DIR/$APP_NAME.xcodeproj"
          mv "$XCPROJ" "$NEW_XCPROJ"

          # Replace $binary placeholder throughout all text files
          find "$PROJ_DIR" \( -name "*.pbxproj" -o -name "*.plist" -o -name "*.mm" \
            -o -name "*.m" -o -name "*.h" -o -name "*.swift" -o -name "*.entitlements" \
            -o -name "*.xcscheme" \) | while read f; do
            sed -i '' "s/\$binary/$APP_NAME/g" "$f" 2>/dev/null || true
            sed -i '' "s/godot_apple_embedded/$APP_NAME/g" "$f" 2>/dev/null || true
            sed -i '' "s/godot_ios/$APP_NAME/g" "$f" 2>/dev/null || true
          done

          # Rename source files that reference the old binary name
          find "$PROJ_DIR" -name "godot_apple_embedded*" | while read f; do
            newname=$(echo "$f" | sed "s/godot_apple_embedded/$APP_NAME/g")
            mv "$f" "$newname" 2>/dev/null || true
          done
          find "$PROJ_DIR" -name "godot_ios*" | while read f; do
            newname=$(echo "$f" | sed "s/godot_ios/$APP_NAME/g")
            mv "$f" "$newname" 2>/dev/null || true
          done

          # Update bundle identifier in Info.plist
          find "$PROJ_DIR" -name "Info.plist" | while read f; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$f" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleName $APP_NAME" "$f" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION_SHORT" "$f" 2>/dev/null || true
          done

          # Copy PCK into the project
          cp "$GITHUB_WORKSPACE/build/pck/$APP_NAME.pck" "$PROJ_DIR/$APP_NAME.pck"

          echo "=== Final project structure ==="
          find "$PROJ_DIR" -maxdepth 3 -name "*.xcodeproj" -o -name "*.plist" | head -20

      # ── 6. Build unsigned .ipa ───────────────────────────────────────────────
      - name: Build Xcode archive (unsigned)
        run: |
          PROJ=$(find "$GITHUB_WORKSPACE/build/ios" -name "*.xcodeproj" | head -1)
          SCHEME=$(basename "$PROJ" .xcodeproj)
          echo "Building: $PROJ (scheme: $SCHEME)"

          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$GITHUB_WORKSPACE/build/$APP_NAME.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | grep -E "(error:|warning:|Build succeeded|** ARCHIVE|FAILED)" || true

          # Check archive was created
          if [ ! -d "$GITHUB_WORKSPACE/build/$APP_NAME.xcarchive" ]; then
            echo "Archive not created — full xcodebuild output:"
            xcodebuild \
              -project "$PROJ" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$GITHUB_WORKSPACE/build/$APP_NAME.xcarchive" \
              archive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              DEVELOPMENT_TEAM="" 2>&1 | tail -80
            exit 1
          fi

      - name: Package .ipa
        run: |
          ARCHIVE="$GITHUB_WORKSPACE/build/$APP_NAME.xcarchive"
          APP_PATH=$(find "$ARCHIVE/Products" -name "*.app" | head -1)
          echo "App: $APP_PATH"
          mkdir -p /tmp/Payload
          cp -r "$APP_PATH" "/tmp/Payload/$APP_NAME.app"
          cd /tmp && zip -qr "$GITHUB_WORKSPACE/build/$APP_NAME.ipa" Payload
          IPA_SIZE=$(stat -f%z "$GITHUB_WORKSPACE/build/$APP_NAME.ipa")
          echo "IPA_SIZE=$IPA_SIZE" >> $GITHUB_ENV
          echo "IPA: $(du -sh "$GITHUB_WORKSPACE/build/$APP_NAME.ipa")"

      # ── 7. Release & AltStore feed ───────────────────────────────────────────
      - name: Set version tag
        run: |
          VERSION="$VERSION_SHORT.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --repo p-scott-0/ironveil \
            --title "$APP_NAME $VERSION" \
            --notes "Build #${{ github.run_number }} — ${{ github.sha }}" \
            "$GITHUB_WORKSPACE/build/$APP_NAME.ipa#$APP_NAME.ipa"

      - name: Update AltStore apps.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DOWNLOAD_URL="https://github.com/p-scott-0/ironveil/releases/download/$TAG/$APP_NAME.ipa"
          BUILD_DATE=$(date -u +"%Y-%m-%d")
          python3 - <<EOF
          import json
          with open("$GITHUB_WORKSPACE/altstore/apps.json") as f:
              data = json.load(f)
          data["apps"][0]["versions"].insert(0, {
              "version": "$VERSION", "date": "$BUILD_DATE",
              "localizedDescription": "Build #${{ github.run_number }}",
              "downloadURL": "$DOWNLOAD_URL", "size": $IPA_SIZE
          })
          data["apps"][0]["versions"] = data["apps"][0]["versions"][:10]
          with open("$GITHUB_WORKSPACE/altstore/apps.json", "w") as f:
              json.dump(data, f, indent=2)
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./altstore
          keep_files: true

      - name: Build summary
        run: |
          echo "## ✅ $APP_NAME $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "| IPA | [Download](https://github.com/p-scott-0/ironveil/releases/tag/$TAG) |" >> $GITHUB_STEP_SUMMARY
          echo "| AltStore | \`https://p-scott-0.github.io/ironveil/apps.json\` |" >> $GITHUB_STEP_SUMMARY
