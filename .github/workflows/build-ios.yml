name: Build iOS IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  APP_NAME: Ironveil
  BUNDLE_ID: com.pscott.ironveil
  VERSION_SHORT: "0.1"

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download & install Godot 4.6.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_macos.universal.zip
          unzip -q Godot_v4.6.3-stable_macos.universal.zip
          sudo mv Godot.app /Applications/Godot.app

      - name: Download & install export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.6.3.stable"
          mkdir -p "$TEMPLATE_DIR"
          unzip -q Godot_v4.6.3-stable_export_templates.tpz -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* "$TEMPLATE_DIR/"

      - name: Create trusted signing identity
        run: |
          cat > /tmp/cert.conf << 'CONF'
          [req]
          distinguished_name = req_dn
          x509_extensions = v3_req
          prompt = no
          [req_dn]
          CN = iPhone Developer
          O = CI Build
          C = US
          [v3_req]
          keyUsage = critical, digitalSignature
          extendedKeyUsage = critical, codeSigning
          CONF
          openssl req -x509 -newkey rsa:2048 -days 1 -config /tmp/cert.conf \
            -keyout /tmp/ci_key.pem -out /tmp/ci_cert.pem -nodes 2>/dev/null
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain /tmp/ci_cert.pem
          openssl pkcs12 -export -inkey /tmp/ci_key.pem -in /tmp/ci_cert.pem \
            -out /tmp/ci_cert.p12 -passout pass:ci
          security import /tmp/ci_cert.p12 -k ~/Library/Keychains/login.keychain-db \
            -P "ci" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" \
            ~/Library/Keychains/login.keychain-db 2>/dev/null || true
          echo "Signing identities:" && security find-identity -v -p codesigning

      - name: Export iOS Xcode project
        run: |
          mkdir -p build/ios
          /Applications/Godot.app/Contents/MacOS/Godot \
            --headless \
            --export-debug "iOS" \
            "$GITHUB_WORKSPACE/build/ios/$APP_NAME" \
            --path "$GITHUB_WORKSPACE" 2>&1
          echo "--- build/ios contents ---"
          ls build/ios/ || echo "empty"

      - name: Build Xcode archive (unsigned)
        run: |
          PROJ=$(find "$GITHUB_WORKSPACE/build/ios" -name "*.xcodeproj" | head -1)
          SCHEME=$(basename "$PROJ" .xcodeproj)
          echo "Building: $PROJ"
          xcodebuild \
            -project "$PROJ" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -archivePath "$GITHUB_WORKSPACE/build/$APP_NAME.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM=""

      - name: Package .ipa
        run: |
          APP_PATH=$(find "$GITHUB_WORKSPACE/build/$APP_NAME.xcarchive/Products" -name "*.app" | head -1)
          mkdir -p /tmp/Payload
          cp -r "$APP_PATH" "/tmp/Payload/$APP_NAME.app"
          cd /tmp && zip -qr "$GITHUB_WORKSPACE/build/$APP_NAME.ipa" Payload
          IPA_SIZE=$(stat -f%z "$GITHUB_WORKSPACE/build/$APP_NAME.ipa")
          echo "IPA_SIZE=$IPA_SIZE" >> $GITHUB_ENV
          echo "IPA: $(du -sh "$GITHUB_WORKSPACE/build/$APP_NAME.ipa")"

      - name: Set version tag
        run: |
          VERSION="$VERSION_SHORT.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" --repo p-scott-0/ironveil \
            --title "$APP_NAME $VERSION" \
            --notes "Build #${{ github.run_number }} — ${{ github.sha }}" \
            "$GITHUB_WORKSPACE/build/$APP_NAME.ipa#$APP_NAME.ipa"

      - name: Update AltStore apps.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DOWNLOAD_URL="https://github.com/p-scott-0/ironveil/releases/download/$TAG/$APP_NAME.ipa"
          BUILD_DATE=$(date -u +"%Y-%m-%d")
          python3 - <<EOF
          import json
          with open("$GITHUB_WORKSPACE/altstore/apps.json") as f:
              data = json.load(f)
          data["apps"][0]["versions"].insert(0, {
              "version": "$VERSION", "date": "$BUILD_DATE",
              "localizedDescription": "Build #${{ github.run_number }}",
              "downloadURL": "$DOWNLOAD_URL", "size": $IPA_SIZE
          })
          data["apps"][0]["versions"] = data["apps"][0]["versions"][:10]
          with open("$GITHUB_WORKSPACE/altstore/apps.json", "w") as f:
              json.dump(data, f, indent=2)
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./altstore
          keep_files: true

      - name: Build summary
        run: |
          echo "## ✅ $APP_NAME $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "| IPA | [Download](https://github.com/p-scott-0/ironveil/releases/tag/$TAG) |" >> $GITHUB_STEP_SUMMARY
